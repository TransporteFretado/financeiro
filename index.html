<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Ações e Cripto</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e11; --card-bg: #161a1e; --text-main: #e3e6e8;
            --text-muted: #707a8a; --border: #2b3139; --success: #00f2a1; --danger: #ff4d6d; --warning: #ffb800;
        }

        [data-theme="light"] {
            --bg: #f0f2f5; --card-bg: #ffffff; --text-main: #1e2329;
            --text-muted: #474d57; --border: #dcdfe4; --success: #03a66d; --danger: #cf304a; --warning: #f0b90b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text-main); padding-bottom: 90px; transition: background 0.3s; }
        
        /* Ticker Cripto via Widget (Sem API) */
        .crypto-ticker-container { width: 100%; height: 40px; background: var(--card-bg); border-bottom: 1px solid var(--border); overflow: hidden; }
        
        .static-ticker { background: rgba(0,0,0,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 0; font-size: 0.7rem; font-weight: 700; }
        
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; }
        .header { text-align: center; margin: 20px 0; }
        .header h1 { font-size: 1.4rem; font-weight: 900; color: var(--warning); letter-spacing: -1px; }
        .header p { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; margin-top: 3px; font-style: italic; }
        
        .btn-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .btn { flex: 1; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; cursor: pointer; }

        .sector-section { margin-bottom: 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .sector-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .sector-title { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }

        .grid { display: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 10px; background: var(--bg); }
        .expanded .grid { display: grid; }

        .card { background: var(--card-bg); padding: 15px 10px; border-radius: 10px; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 180px; }
        
        .card.opportunity { animation: pulse-border-fundo 2s infinite; }
        @keyframes pulse-border-fundo {
            0%, 100% { border-color: var(--success); box-shadow: 0 0 5px rgba(0, 242, 161, 0.1); }
            50% { border-color: var(--warning); box-shadow: 0 0 20px rgba(255, 184, 0, 0.3); }
        }

        .buy-label { font-size: 0.5rem; font-weight: 800; color: var(--success); margin-bottom: 6px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }
        
        .ticker-link { font-size: 1rem; font-weight: 800; color: #3b82f6; text-decoration: none; margin-bottom: 2px; }
        .asset-name { font-size: 0.55rem; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; }
        .price { font-size: 1.25rem; font-weight: 800; margin-bottom: 4px; }
        .up { color: var(--success); } .down { color: var(--danger); }

        /* CALCULADORA */
        .calc-box { margin-top: 10px; width: 100%; border-top: 1px dashed var(--border); padding-top: 8px; }
        .calc-input { width: 60px; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); font-size: 0.7rem; padding: 2px; border-radius: 4px; text-align: center; }
        .calc-res { font-size: 0.65rem; font-weight: 800; color: var(--success); margin-top: 4px; display: block; }

        .info-footer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); width: 100%; }
        .info-label { font-size: 0.5rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .info-value { font-size: 0.85rem; font-weight: 800; color: var(--warning); }

        .market-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--card-bg); border-top: 2px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .news-links { display: flex; gap: 15px; margin-bottom: 3px; }
        .news-link { color: var(--text-muted); text-decoration: none; font-size: 0.6rem; font-weight: 700; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; }
        .dot-open { background: var(--success); } .dot-closed { background: var(--danger); }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr !important; } }
    </style>
</head>
<body id="mainBody">

<div class="crypto-ticker-container">
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
        "symbols": [
            {"proName": "BINANCE:BTCBRL", "title": "Bitcoin"},
            {"proName": "BINANCE:ETHBRL", "title": "Ethereum"},
            {"proName": "BINANCE:SOLBRL", "title": "Solana"},
            {"proName": "BINANCE:BNBBRL", "title": "Binance Coin"}
        ],
        "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "br"
        }
        </script>
    </div>
</div>

<div class="static-ticker" id="macroTicker"><span>Sincronizando IBOV/DOLAR...</span></div>

<div class="container">
    <div class="header">
        <h1>Painel de Ações e Cripto</h1>
        <p>"Siga o fluxo inteligente do capital..."</p>
    </div>
    <div class="btn-container">
        <button class="btn" onclick="toggleAll(true)">EXPANDIR TUDO</button>
        <button class="btn" onclick="toggleAll(false)">RECOLHER TUDO</button>
    </div>
    <div id="dashboard-content"></div>
</div>

<div class="market-footer">
    <div class="news-links">
        <a href="https://g1.globo.com/economia/" target="_blank" class="news-link">► G1 Economia</a>
        <a href="https://br.investing.com/news/most-popular-news" target="_blank" class="news-link">► Investing.com</a>
        <a href="https://www.infomoney.com.br/mercados/" target="_blank" class="news-link">► InfoMoney</a>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
        <div id="dot" class="status-dot"></div>
        <span id="statusText" style="font-size: 0.65rem; font-weight: 800;">CARREGANDO...</span>
    </div>
</div>

<script>
    const API_TOKEN = 'nctccHqqPkRvTdxGsZeK2f';
    const config = { "BBAS3": 35.00, "ITUB4": 45.00, "PETR4": 40.00, "VALE3": 80.00, "MXRF11": 10.50 };
    const sectors = {
        "Bancos & Seguros": { "BBAS3": "Banco do Brasil", "ITUB4": "Itaú", "CXSE3": "Caixa Seg", "BBSE3": "BB Seg" },
        "Petróleo & Gás": { "PETR4": "Petrobras", "PRIO3": "PetroRio", "RECV3": "PetroRecôncavo" },
        "FIIs": { "MXRF11": "Maxi Renda", "HGLG11": "CSHG Log", "XPLG11": "XP Log" },
        "Papel & Indústria": { "KLBN11": "Klabin", "WEGE3": "WEG S.A" }
    };

    let opportunityAlerted = false;

    function playAlert() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function applyTheme() {
        const hour = new Date().getHours();
        const body = document.getElementById('mainBody');
        if (hour >= 6 && hour < 18) body.setAttribute('data-theme', 'light');
    }

    async function fetchMacro() {
        try {
            const res = await fetch(`https://brapi.dev/api/quote/IBOV,USDBRL?token=${API_TOKEN}`);
            const data = await res.json();
            const ibov = data.results[0];
            const usd = data.results[1];
            document.getElementById('macroTicker').innerHTML = `
                <span>IBOV: <span class="${ibov.regularMarketChangePercent >= 0 ? 'up' : 'down'}">${ibov.regularMarketPrice.toLocaleString()} (${ibov.regularMarketChangePercent.toFixed(1)}%)</span></span>
                <span>DOLAR: <span class="${usd.regularMarketChangePercent >= 0 ? 'up' : 'down'}">R$ ${usd.regularMarketPrice.toFixed(2)} (${usd.regularMarketChangePercent.toFixed(1)}%)</span></span>
            `;
        } catch (e) { console.error("Erro Macro"); }
    }

    async function renderStocks() {
        const container = document.getElementById('dashboard-content');
        container.innerHTML = "";
        let hasOpportunity = false;

        for (const [name, list] of Object.entries(sectors)) {
            const id = name.replace(/\s/g, '');
            const sectorDiv = document.createElement('div');
            sectorDiv.className = 'sector-section';
            sectorDiv.id = `sec-${id}`;
            sectorDiv.innerHTML = `<div class="sector-header" onclick="toggleSector('${id}')"><span class="sector-title">${name} (${Object.keys(list).length})</span><span>▼</span></div><div class="grid" id="grid-${id}"></div>`;
            container.appendChild(sectorDiv);
            
            const grid = document.getElementById(`grid-${id}`);
            for (const ticker in list) {
                try {
                    const res = await fetch(`https://brapi.dev/api/quote/${ticker}?token=${API_TOKEN}`);
                    const data = await res.json();
                    const asset = data.results[0];
                    const teto = config[ticker] || 0;
                    const isOpp = teto > 0 && asset.regularMarketPrice <= teto;
                    if(isOpp) hasOpportunity = true;

                    grid.innerHTML += `
                        <div class="card ${isOpp ? 'opportunity' : ''}">
                            ${isOpp ? '<span class="buy-label">COMPRA!</span>' : ''}
                            <a href="https://www.google.com/finance/quote/${ticker}:BVMF" target="_blank" class="ticker-link">${ticker}</a>
                            <span class="asset-name">${list[ticker]}</span>
                            <span class="price">R$ ${asset.regularMarketPrice.toFixed(2)}</span>
                            
                            <div class="calc-box">
                                <input type="number" class="calc-input" placeholder="Qtd" oninput="calcSub(this, ${asset.regularMarketPrice})">
                                <span class="calc-res">Total: R$ 0,00</span>
                            </div>

                            <div class="info-footer">
                                <span class="info-label">TETO:</span> <span class="info-value">R$ ${teto.toFixed(2)}</span>
                            </div>
                        </div>`;
                } catch (e) {}
            }
        }
        if(hasOpportunity && !opportunityAlerted) {
            playAlert();
            opportunityAlerted = true;
        }
    }

    function calcSub(el, price) {
        const res = el.nextElementSibling;
        const total = (el.value * price).toLocaleString('pt-BR', {minimumFractionDigits: 2});
        res.innerText = `Total: R$ ${total}`;
    }

    function toggleSector(id) { document.getElementById(`sec-${id}`).classList.toggle('expanded'); }
    function toggleAll(expand) { document.querySelectorAll('.sector-section').forEach(s => expand ? s.classList.add('expanded') : s.classList.remove('expanded')); }
    
    function updateClock() {
        const now = new Date();
        const isOpen = (now.getDay() >= 1 && now.getDay() <= 5) && (now.getHours() >= 10 && now.getHours() < 18);
        document.getElementById('dot').className = `status-dot ${isOpen ? 'dot-open' : 'dot-closed'}`;
        document.getElementById('statusText').innerText = `B3 ${isOpen ? 'ABERTO' : 'FECHADO'} | ${now.toLocaleTimeString('pt-BR')}`;
    }

    applyTheme();
    fetchMacro();
    renderStocks();
    setInterval(updateClock, 1000);
</script>
</body>
</html>
